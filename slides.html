<!doctype html>
<html lang="zh-TW" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>面試簡報 | Ray Fan</title>
    <meta name="robots" content="noindex" />
  </head>
  <body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between items-center p-4 sm:p-6 overflow-hidden select-none">

    <div class="fixed inset-0 grid-bg bg-grid-pattern pointer-events-none opacity-60 z-0"></div>
    <div class="fixed top-1/4 -left-32 w-96 h-96 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="fixed bottom-1/4 -right-32 w-96 h-96 bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>

    <div id="slide" class="slide-stage relative z-10 my-auto"></div>

    <div class="mt-4 flex items-center gap-4 sm:gap-6 text-xs font-mono text-slate-500 z-10">
      <button id="prev" class="flex items-center gap-1.5 px-3 py-1.5 rounded border border-slate-800 bg-slate-900/80 hover:text-cyan-400 hover:border-cyan-800 disabled:opacity-30 disabled:hover:text-slate-500 disabled:hover:border-slate-800 transition-colors">
        ← Prev
      </button>
      <span id="counter" class="tabular-nums text-slate-400"></span>
      <button id="next" class="flex items-center gap-1.5 px-3 py-1.5 rounded border border-slate-800 bg-slate-900/80 hover:text-cyan-400 hover:border-cyan-800 disabled:opacity-30 disabled:hover:text-slate-500 disabled:hover:border-slate-800 transition-colors">
        Next →
      </button>
      <span class="hidden sm:inline text-slate-600">|</span>
      <span class="hidden sm:inline">← → / Space 翻頁 · F 全螢幕</span>
    </div>

    <script type="module" src="/src/slides.js"></script>
  </body>
</html>
